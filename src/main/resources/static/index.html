<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi KTP | Tugas CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 900px; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container py-5">
    <h2 class="text-center mb-4">Sistem Manajemen Data KTP</h2>

    <div class="card mb-5">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0" id="formTitle">Tambah Data KTP</h5>
        </div>
        <div class="card-body">
            <form id="ktpForm">
                <input type="hidden" id="ktpId">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nomor KTP</label>
                        <input type="text" id="nomorKtp" class="form-control" placeholder="16 digit nomor" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nama Lengkap</label>
                        <input type="text" id="namaLengkap" class="form-control" placeholder="Nama sesuai identitas" required>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Alamat</label>
                        <textarea id="alamat" class="form-control" rows="2" placeholder="Alamat lengkap..."></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tanggal Lahir</label>
                        <input type="date" id="tanggalLahir" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Jenis Kelamin</label>
                        <select id="jenisKelamin" class="form-select" required>
                            <option value="" selected disabled>Pilih Gender...</option>
                            <option value="Laki-laki">Laki-laki</option>
                            <option value="Perempuan">Perempuan</option>
                        </select>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary" id="btnSubmit">Simpan Data</button>
                    <button type="button" class="btn btn-secondary d-none" id="btnCancel" onclick="resetForm()">Batal</button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-container">
        <h5 class="mb-3">Daftar Penduduk</h5>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>No KTP</th>
                    <th>Nama</th>
                    <th>Alamat</th>
                    <th>Tgl Lahir</th>
                    <th>Gender</th>
                    <th>Aksi</th>
                </tr>
                </thead>
                <tbody id="ktpTableBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = "/ktp";

    $(document).ready(function() {
        loadData();

        // Handle Form Submit (Tambah & Update)
        $('#ktpForm').on('submit', function(e) {
            e.preventDefault();

            const id = $('#ktpId').val();
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            const payload = {
                nomorKtp: $('#nomorKtp').val(),
                namaLengkap: $('#namaLengkap').val(),
                alamat: $('#alamat').val(),
                tanggalLahir: $('#tanggalLahir').val(),
                jenisKelamin: $('#jenisKelamin').val()
            };

            $.ajax({
                url: url,
                type: method,
                contentType: "application/json",
                data: JSON.stringify(payload),
                success: function(response) {
                    alert(id ? "Data berhasil diperbarui!" : "Data berhasil ditambahkan!");
                    resetForm();
                    loadData();
                },
                error: function(err) {
                    alert("Gagal: " + (err.responseJSON ? err.responseJSON.message : "Terjadi kesalahan sistem"));
                }
            });
        });
    });

    // Fungsi GET All Data
    function loadData() {
        $.get(API_URL, function(response) {
            let rows = '';
            if (response.data.length === 0) {
                rows = '<tr><td colspan="6" class="text-center text-muted">Belum ada data penduduk.</td></tr>';
            } else {
                response.data.forEach(item => {
                    rows += `
                        <tr>
                            <td>${item.nomorKtp}</td>
                            <td>${item.namaLengkap}</td>
                            <td>${item.alamat}</td>
                            <td>${item.tanggalLahir}</td>
                            <td><span class="badge bg-info text-dark">${item.jenisKelamin}</span></td>
                            <td>
                                <button class="btn btn-sm btn-warning me-1" onclick="editData(${item.id})">Edit</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteData(${item.id})">Hapus</button>
                            </td>
                        </tr>
                    `;
                });
            }
            $('#ktpTableBody').html(rows);
        });
    }

    // Fungsi GET by ID (untuk Edit)
    function editData(id) {
        $.get(`${API_URL}/${id}`, function(response) {
            const d = response.data;
            $('#ktpId').val(d.id);
            $('#nomorKtp').val(d.nomorKtp);
            $('#namaLengkap').val(d.namaLengkap);
            $('#alamat').val(d.alamat);
            $('#tanggalLahir').val(d.tanggalLahir);
            $('#jenisKelamin').val(d.jenisKelamin);

            $('#formTitle').text("Ubah Data KTP");
            $('#btnSubmit').text("Perbarui Data").removeClass('btn-primary').addClass('btn-success');
            $('#btnCancel').removeClass('d-none');
            window.scrollTo(0, 0);
        });
    }

    // Fungsi DELETE
    function deleteData(id) {
        if (confirm("Apakah Anda yakin ingin menghapus data ini?")) {
            $.ajax({
                url: `${API_URL}/${id}`,
                type: 'DELETE',
                success: function() {
                    alert("Data berhasil dihapus!");
                    loadData();
                },
                error: function() {
                    alert("Gagal menghapus data.");
                }
            });
        }
    }

    function resetForm() {
        $('#ktpId').val('');
        $('#ktpForm')[0].reset();
        $('#formTitle').text("Tambah Data KTP");
        $('#btnSubmit').text("Simpan Data").removeClass('btn-success').addClass('btn-primary');
        $('#btnCancel').addClass('d-none');
    }
</script>

</body>
</html>
